name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next semver tag
        id: semver
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch --tags --force
          # Find latest vX.Y.Z tag, default to v0.0.0 if none exists
          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          echo "Latest tag: $LATEST"
          VER=${LATEST#v}
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)
          PATCH=$((PATCH + 1))
          TAG="v${MAJOR}.${MINOR}.${PATCH}"
          # Safety: if tag already exists (re-run), keep bumping until free
          while git rev-parse "$TAG" >/dev/null 2>&1; do
            PATCH=$((PATCH + 1))
            TAG="v${MAJOR}.${MINOR}.${PATCH}"
          done
          echo "Next tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK (debug-signed)
        run: flutter build apk --release --build-name=${{ steps.semver.outputs.version || '0.0.0-dev' }} --build-number=${{ github.run_number }}

      - name: Rename APK with meaningful name
        id: apk
        run: |
          OUT="build/app/outputs/flutter-apk"
          if [ -n "${{ steps.semver.outputs.tag }}" ]; then
            FILENAME="blackwood-manor-${{ steps.semver.outputs.tag }}.apk"
          else
            REF="${{ github.head_ref || github.ref_name }}"
            SAFE=$(echo "$REF" | tr '/"' '__' | tr -d ':<>|*?\\' | cut -c1-60)
            FILENAME="blackwood-manor-test-${SAFE}-r${{ github.run_number }}.apk"
          fi
          mv "$OUT/app-release.apk" "$OUT/$FILENAME"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
          echo "artifact=${FILENAME%.apk}" >> "$GITHUB_OUTPUT"
          echo "path=$OUT/$FILENAME" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release (auto-creates tag)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.tag }}
          name: Release ${{ steps.semver.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
          make_latest: true